    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--surface);
        min-height: 100vh;
        color: var(--ink);
    }

    /* ── LOGIN ── */
    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ink);
        position: relative;
        overflow: hidden;
    }

    #loginScreen::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 30% 60%, rgba(200,151,74,0.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(200,151,74,0.08) 0%, transparent 50%);
    }

    .login-box {
        position: relative;
        z-index: 1;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(200,151,74,0.3);
        border-radius: 4px;
        padding: 50px 44px;
        width: 100%;
        max-width: 400px;
        backdrop-filter: blur(10px);
        animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
        text-align: center;
        margin-bottom: 36px;
    }

    .login-logo .icon {
        font-size: 40px;
        display: block;
        margin-bottom: 12px;
    }

    .login-logo h1 {
        font-family: 'Playfair Display', serif;
        color: var(--accent);
        font-size: 22px;
        letter-spacing: 0.5px;
    }

    .login-logo p {
        color: rgba(255,255,255,0.4);
        font-size: 12px;
        margin-top: 4px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .login-field {
        margin-bottom: 18px;
    }

    .login-field label {
        display: block;
        color: rgba(255,255,255,0.5);
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .login-field input {
        width: 100%;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(200,151,74,0.2);
        border-radius: 3px;
        padding: 13px 16px;
        color: white;
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        transition: border-color 0.2s;
    }

    .login-field input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255,255,255,0.09);
    }

    .login-field input::placeholder { color: rgba(255,255,255,0.25); }

    .login-btn {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: var(--ink);
        border: none;
        border-radius: 3px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s, transform 0.1s;
    }

    .login-btn:hover { background: var(--accent2); }
    .login-btn:active { transform: scale(0.99); }

    .login-error {
        background: rgba(176,58,46,0.2);
        border: 1px solid rgba(176,58,46,0.5);
        color: #f1948a;
        padding: 10px 14px;
        border-radius: 3px;
        font-size: 13px;
        margin-top: 14px;
        display: none;
    }

    /* ── APP ── */
    #appScreen { display: none; }

    .topbar {
        background: var(--ink);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .topbar-brand {
        font-family: 'Playfair Display', serif;
        color: var(--accent);
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .topbar-user {
        color: rgba(255,255,255,0.5);
        font-size: 13px;
    }

    .btn-logout {
        background: transparent;
        border: 1px solid rgba(200,151,74,0.4);
        color: var(--accent);
        padding: 7px 16px;
        border-radius: 3px;
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-logout:hover {
        background: var(--accent);
        color: var(--ink);
    }

    .main-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px;
    }

    /* ── FOTOS ── */
    .photos-section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 28px;
    }

    .photo-card {
        background: var(--card);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        border: 1px solid var(--border);
        animation: fadeUp 0.5s ease both;
    }

    .photo-card:nth-child(2) { animation-delay: 0.1s; }

    .photo-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
    }

    .photo-card-label {
        padding: 12px 16px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.5px;
        border-top: 1px solid var(--border);
    }

    /* ── STATS ── */
    .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-box {
        background: var(--ink);
        color: white;
        border-radius: 6px;
        padding: 22px 24px;
        position: relative;
        overflow: hidden;
    }

    .stat-box::after {
        content: '';
        position: absolute;
        right: -20px;
        bottom: -20px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(200,151,74,0.12);
    }

    .stat-box h4 {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        margin-bottom: 10px;
    }

    .stat-box p {
        font-family: 'Playfair Display', serif;
        font-size: 38px;
        color: var(--accent);
        line-height: 1;
    }

    /* ── CARDS ── */
    .card {
        background: var(--card);
        border-radius: 6px;
        border: 1px solid var(--border);
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        margin-bottom: 24px;
        overflow: hidden;
    }

    .card-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .card-header h3 {
        font-family: 'Playfair Display', serif;
        font-size: 18px;
        color: var(--ink);
    }

    .card-body { padding: 24px; }

    /* ── FORM ── */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 7px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--border);
        border-radius: 4px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: var(--surface);
        transition: border-color 0.2s, background 0.2s;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--accent);
        background: white;
    }

    .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
        padding: 11px 22px;
        border: none;
        border-radius: 4px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: var(--ink); }
    .btn-primary:hover { background: var(--accent2); }

    .btn-ghost {
        background: transparent;
        border: 1.5px solid var(--border);
        color: var(--muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
        background: var(--surface);
        padding: 12px 16px;
        text-align: left;
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        border-bottom: 2px solid var(--border);
    }

    tbody td {
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        color: var(--ink);
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: rgba(200,151,74,0.05); }

    .action-btn {
        padding: 5px 12px;
        font-size: 12px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-family: 'DM Sans', sans-serif;
        font-weight: 600;
        margin-right: 5px;
        transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.8; }
    .btn-edit { background: #dbeafe; color: var(--info); }
    .btn-del  { background: #fde8e8; color: var(--danger); }

    /* ── ALERTS ── */
    .alert {
        padding: 12px 18px;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 18px;
        display: none;
    }
    .alert-ok  { background: #d5f5e3; color: var(--success); border: 1px solid #a9dfbf; }
    .alert-err { background: #fde8e8; color: var(--danger); border: 1px solid #f5b7b1; }

    .empty-row td { text-align: center; color: var(--muted); padding: 40px !important; font-style: italic; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
        .photos-section { grid-template-columns: 1fr; }
        .login-box { padding: 36px 24px; }
        .topbar-user { display: none; }
    }
</style>

<!-- Firebase SDK -->

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc,
             query, orderBy, updateDoc, serverTimestamp }
        from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyA8XhoL5V9lGIU9lc-9jGJEa30fy5o3yCM",
        authDomain: "sara-160cc.firebaseapp.com",
        projectId: "sara-160cc",
        storageBucket: "sara-160cc.firebasestorage.app",
        messagingSenderId: "461127699414",
        appId: "1:461127699414:web:3217536353b5069e89f277"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let editingId = null;

    /* ── AUTH LOCAL ── */
    window.doLogin = () => {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value;
        if (u === 'oscar' && p === '2213') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display   = 'block';
            loadVotantes();
        } else {
            const err = document.getElementById('loginError');
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 3000);
        }
    };

    // Login con Enter
    ['loginUser','loginPass'].forEach(id =>
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') window.doLogin();
        })
    );

    window.doLogout = () => {
        document.getElementById('appScreen').style.display   = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
    };

    /* ── ALERTS ── */
    function showAlert(type, msg) {
        const el = document.getElementById(type === 'ok' ? 'alertOk' : 'alertErr');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }

    /* ── FORM ── */
    window.limpiarForm = () => {
        ['nombre','cedula','celular','lugarVotacion','mesaVotacion']
            .forEach(id => document.getElementById(id).value = '');
        editingId = null;
        document.getElementById('submitLabel').textContent = 'Registrar Votante';
    };

    window.guardarVotante = async () => {
        const nombre        = document.getElementById('nombre').value.trim();
        const cedula        = document.getElementById('cedula').value.trim();
        const celular       = document.getElementById('celular').value.trim();
        const lugarVotacion = document.getElementById('lugarVotacion').value.trim();
        const mesaVotacion  = document.getElementById('mesaVotacion').value.trim();

        if (!nombre || !cedula || !celular || !lugarVotacion || !mesaVotacion) {
            showAlert('err', 'Por favor complete todos los campos.');
            return;
        }

        const data = { nombre, cedula, celular, lugarVotacion, mesaVotacion,
                       fechaRegistro: serverTimestamp() };
        try {
            if (editingId) {
                await updateDoc(doc(db, 'votantes', editingId), data);
                showAlert('ok', 'Votante actualizado exitosamente.');
            } else {
                await addDoc(collection(db, 'votantes'), data);
                showAlert('ok', 'Votante registrado exitosamente.');
            }
            limpiarForm();
            loadVotantes();
        } catch (e) {
            showAlert('err', 'Error: ' + e.message);
        }
    };

    /* ── LOAD ── */
    async function loadVotantes() {
        const tbody = document.getElementById('votantesTable');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Cargando...</td></tr>';
        try {
            const q   = query(collection(db, 'votantes'), orderBy('fechaRegistro', 'desc'));
            const snap = await getDocs(q);

            if (snap.empty) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No hay votantes registrados aún.</td></tr>';
                updateStats(0, 0);
                return;
            }

            let total = 0, hoyCount = 0;
            const hoy = new Date().toDateString();
            tbody.innerHTML = '';

            snap.forEach(docSnap => {
                const v = docSnap.data();
                total++;
                if (v.fechaRegistro && v.fechaRegistro.toDate().toDateString() === hoy) hoyCount++;

                const fecha = v.fechaRegistro
                    ? new Date(v.fechaRegistro.toDate()).toLocaleDateString('es-CO')
                    : '—';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.nombre}</td>
                    <td>${v.cedula}</td>
                    <td>${v.celular}</td>
                    <td>${v.lugarVotacion}</td>
                    <td>${v.mesaVotacion}</td>
                    <td>${fecha}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editVotante('${docSnap.id}')">Editar</button>
                        <button class="action-btn btn-del"  onclick="delVotante('${docSnap.id}')">Eliminar</button>
                    </td>`;
                tbody.appendChild(tr);
            });

            updateStats(total, hoyCount);
        } catch (e) {
            showAlert('err', 'Error al cargar datos: ' + e.message);
        }
    }

    function updateStats(total, hoy) {
        document.getElementById('totalVotantes').textContent = total;
        document.getElementById('registrosHoy').textContent  = hoy;
    }

    /* ── EDIT ── */
    window.editVotante = async (id) => {
        const snap = await getDocs(collection(db, 'votantes'));
        snap.forEach(d => {
            if (d.id === id) {
                const v = d.data();
                document.getElementById('nombre').value        = v.nombre;
                document.getElementById('cedula').value        = v.cedula;
                document.getElementById('celular').value       = v.celular;
                document.getElementById('lugarVotacion').value = v.lugarVotacion;
                document.getElementById('mesaVotacion').value  = v.mesaVotacion;
                editingId = id;
                document.getElementById('submitLabel').textContent = 'Actualizar Votante';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    };

    /* ── DELETE ── */
    window.delVotante = async (id) => {
        if (!confirm('¿Eliminar este votante?')) return;
        try {
            await deleteDoc(doc(db, 'votantes', id));
            showAlert('ok', 'Votante eliminado.');
            loadVotantes();
        } catch (e) {
            showAlert('err', 'Error al eliminar.');
        }
    };
</script>

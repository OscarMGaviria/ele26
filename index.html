<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Votantes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            color: #666;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #f56565;
            color: white;
        }

        .btn-secondary:hover {
            background: #e53e3e;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .auth-section, .app-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .auth-section {
            max-width: 400px;
            margin: 100px auto;
        }

        .auth-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        table tr:hover {
            background: #f7fafc;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-info {
            background: #4299e1;
            color: white;
        }

        .btn-info:hover {
            background: #3182ce;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #68d391;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card p {
            font-size: 32px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 8px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .stat-card p {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Sección de Autenticación -->
    <div id="authSection" class="auth-section">
        <h2>🗳️ Sistema de Registro de Votantes</h2>
        <div id="authError" class="alert alert-error hidden"></div>
        <div class="form-group">
            <label for="authEmail">Correo electrónico</label>
            <input type="email" id="authEmail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
            <label for="authPassword">Contraseña</label>
            <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>
        <button id="loginBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Iniciar Sesión</button>
        <button id="registerBtn" class="btn btn-success" style="width: 100%;">Registrarse</button>
    </div>

    <!-- Sección de la Aplicación -->
    <div id="appSection" class="hidden">
        <div class="container">
            <div class="header">
                <h1>🗳️ Registro de Votantes</h1>
                <div class="user-info">
                    <span class="user-email" id="userEmail"></span>
                    <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
                </div>
            </div>

            <div id="appError" class="alert alert-error hidden"></div>
            <div id="appSuccess" class="alert alert-success hidden"></div>

            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <h4>Total Votantes</h4>
                    <p id="totalVotantes">0</p>
                </div>
                <div class="stat-card">
                    <h4>Registros Hoy</h4>
                    <p id="registrosHoy">0</p>
                </div>
            </div>

            <!-- Formulario de Registro -->
            <div class="card">
                <h3>Registrar Nuevo Votante</h3>
                <form id="votanteForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombre">Nombre Completo *</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="cedula">Cédula *</label>
                            <input type="text" id="cedula" required>
                        </div>
                        <div class="form-group">
                            <label for="celular">Celular *</label>
                            <input type="tel" id="celular" required>
                        </div>
                        <div class="form-group">
                            <label for="lugarVotacion">Lugar de Votación *</label>
                            <input type="text" id="lugarVotacion" required>
                        </div>
                        <div class="form-group">
                            <label for="mesaVotacion">Mesa de Votación *</label>
                            <input type="text" id="mesaVotacion" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar Votante</button>
                    <button type="button" id="clearFormBtn" class="btn btn-secondary">Limpiar Formulario</button>
                </form>
            </div>

            <!-- Tabla de Votantes -->
            <div class="card">
                <h3>Lista de Votantes Registrados</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Celular</th>
                                <th>Lugar de Votación</th>
                                <th>Mesa</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="votantesTable">
                            <tr>
                                <td colspan="7" class="loading">Cargando votantes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA8XhoL5V9lGIU9lc-9jGJEa30fy5o3yCM",
            authDomain: "sara-160cc.firebaseapp.com",
            projectId: "sara-160cc",
            storageBucket: "sara-160cc.firebasestorage.app",
            messagingSenderId: "461127699414",
            appId: "1:461127699414:web:3217536353b5069e89f277"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Referencias DOM
        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const authError = document.getElementById('authError');
        const appError = document.getElementById('appError');
        const appSuccess = document.getElementById('appSuccess');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const votanteForm = document.getElementById('votanteForm');
        const votantesTable = document.getElementById('votantesTable');
        const userEmail = document.getElementById('userEmail');
        const clearFormBtn = document.getElementById('clearFormBtn');

        // Variable para edición
        let editingId = null;

        // Mostrar/Ocultar mensajes
        function showMessage(element, message) {
            element.textContent = message;
            element.classList.remove('hidden');
            setTimeout(() => element.classList.add('hidden'), 5000);
        }

        // Limpiar formulario
        function clearForm() {
            votanteForm.reset();
            editingId = null;
            document.querySelector('#votanteForm button[type="submit"]').textContent = 'Registrar Votante';
        }

        clearFormBtn.addEventListener('click', clearForm);

        // Registro de usuario
        registerBtn.addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                showMessage(authError, 'Por favor complete todos los campos');
                return;
            }

            if (password.length < 6) {
                showMessage(authError, 'La contraseña debe tener al menos 6 caracteres');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    showMessage(authError, 'Este correo ya está registrado');
                } else if (error.code === 'auth/invalid-email') {
                    showMessage(authError, 'Correo electrónico inválido');
                } else {
                    showMessage(authError, 'Error al registrarse: ' + error.message);
                }
            }
        });

        // Inicio de sesión
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                showMessage(authError, 'Por favor complete todos los campos');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/invalid-credential') {
                    showMessage(authError, 'Credenciales incorrectas');
                } else {
                    showMessage(authError, 'Error al iniciar sesión: ' + error.message);
                }
            }
        });

        // Cerrar sesión
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                showMessage(appError, 'Error al cerrar sesión');
            }
        });

        // Observador de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userEmail.textContent = user.email;
                loadVotantes();
            } else {
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
                document.getElementById('authEmail').value = '';
                document.getElementById('authPassword').value = '';
            }
        });

        // Registrar votante
        votanteForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const votante = {
                nombre: document.getElementById('nombre').value.trim(),
                cedula: document.getElementById('cedula').value.trim(),
                celular: document.getElementById('celular').value.trim(),
                lugarVotacion: document.getElementById('lugarVotacion').value.trim(),
                mesaVotacion: document.getElementById('mesaVotacion').value.trim(),
                fechaRegistro: serverTimestamp(),
                userId: auth.currentUser.uid
            };

            try {
                if (editingId) {
                    // Actualizar votante existente
                    await updateDoc(doc(db, 'votantes', editingId), votante);
                    showMessage(appSuccess, 'Votante actualizado exitosamente');
                } else {
                    // Agregar nuevo votante
                    await addDoc(collection(db, 'votantes'), votante);
                    showMessage(appSuccess, 'Votante registrado exitosamente');
                }
                clearForm();
                loadVotantes();
            } catch (error) {
                showMessage(appError, 'Error al registrar votante: ' + error.message);
            }
        });

        // Cargar votantes
        async function loadVotantes() {
            try {
                const q = query(collection(db, 'votantes'), orderBy('fechaRegistro', 'desc'));
                const querySnapshot = await getDocs(q);
                
                votantesTable.innerHTML = '';

                if (querySnapshot.empty) {
                    votantesTable.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay votantes registrados</td></tr>';
                    updateStats(0, 0);
                    return;
                }

                let totalVotantes = 0;
                let registrosHoy = 0;
                const hoy = new Date().toDateString();

                querySnapshot.forEach((docSnap) => {
                    const votante = docSnap.data();
                    totalVotantes++;

                    // Contar registros de hoy
                    if (votante.fechaRegistro) {
                        const fechaRegistro = votante.fechaRegistro.toDate();
                        if (fechaRegistro.toDateString() === hoy) {
                            registrosHoy++;
                        }
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${votante.nombre}</td>
                        <td>${votante.cedula}</td>
                        <td>${votante.celular}</td>
                        <td>${votante.lugarVotacion}</td>
                        <td>${votante.mesaVotacion}</td>
                        <td>${votante.fechaRegistro ? new Date(votante.fechaRegistro.toDate()).toLocaleDateString() : 'N/A'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-info btn-small" onclick="editVotante('${docSnap.id}')">Editar</button>
                                <button class="btn btn-danger btn-small" onclick="deleteVotante('${docSnap.id}')">Eliminar</button>
                            </div>
                        </td>
                    `;
                    votantesTable.appendChild(row);
                });

                updateStats(totalVotantes, registrosHoy);
            } catch (error) {
                showMessage(appError, 'Error al cargar votantes: ' + error.message);
            }
        }

        // Actualizar estadísticas
        function updateStats(total, hoy) {
            document.getElementById('totalVotantes').textContent = total;
            document.getElementById('registrosHoy').textContent = hoy;
        }

        // Editar votante
        window.editVotante = async (id) => {
            try {
                const docSnap = await getDocs(query(collection(db, 'votantes')));
                docSnap.forEach((doc) => {
                    if (doc.id === id) {
                        const votante = doc.data();
                        document.getElementById('nombre').value = votante.nombre;
                        document.getElementById('cedula').value = votante.cedula;
                        document.getElementById('celular').value = votante.celular;
                        document.getElementById('lugarVotacion').value = votante.lugarVotacion;
                        document.getElementById('mesaVotacion').value = votante.mesaVotacion;
                        editingId = id;
                        document.querySelector('#votanteForm button[type="submit"]').textContent = 'Actualizar Votante';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            } catch (error) {
                showMessage(appError, 'Error al cargar votante');
            }
        };

        // Eliminar votante
        window.deleteVotante = async (id) => {
            if (confirm('¿Está seguro de eliminar este votante?')) {
                try {
                    await deleteDoc(doc(db, 'votantes', id));
                    showMessage(appSuccess, 'Votante eliminado exitosamente');
                    loadVotantes();
                } catch (error) {
                    showMessage(appError, 'Error al eliminar votante');
                }
            }
        };
    </script>
</body>
</html>
